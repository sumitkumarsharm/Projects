<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Editor with Emmet</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="box">
                <label><i class="fa-brands fa-html5"></i> HTML</label>
                <div id="html-code" class="editor"></div>
            </div>

            <div class="box">
                <label><i class="fa-brands fa-css3-alt"></i> CSS</label>
                <div id="css-code" class="editor"></div>
            </div>

            <div class="box">
                <label><i class="fa-brands fa-js"></i> JavaScript</label>
                <div id="js-code" class="editor"></div>
            </div>
        </div>

        <div class="right">
            <label><i class="fa-solid fa-play"></i> Output</label>
            <iframe id="output"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
