<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Letter Popup</title>

    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Subscribe Button -->
    <a class="button" id="newsLetterButton" onclick="toggleNewsLetter()">Subscribe Us</a>

    <!-- Newsletter Popup -->
    <div id="newsLetter">
        <h2>Join Our Exclusive Newsletter</h2>
        <p>Follow my other courses as well from my instructor profile.</p>

        <div class="box">
            <input type="email" id="email" placeholder="Enter Email" />
        </div>

        <div class="box">
            <button type="submit" id="SignUpbtn" onclick="SignUp()">Sign Up</button>
        </div>

        <a class="close" onclick="toggleNewsLetter()">
            <i class="fa fa-times fa-2x" aria-hidden="true"></i>
        </a>
    </div>
    <p id="copyright">@ <span id="copyrightDate">2023</span> Sumit Sharma</p>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
</body>

</html>
