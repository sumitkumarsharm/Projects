<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Responsive Todo App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="header">
        <h1>Todo App</h1>
        <button id="theme-toggle">Toggle Dark/Light</button>
        <input type="text" id="filter-input" placeholder="Filter tasks...">
    </div>
    <div class="add-section">
        <input type="text" id="new-task" placeholder="Add new task">
        <button id="add-task-btn">Add Task</button>
    </div>
    <div class="board">
        <div class="column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="col-header">ToDo</div>
            <div class="task-list" id="todo-list"></div>
        </div>
        <div class="column" id="progress" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="col-header">In Progress</div>
            <div class="task-list" id="progress-list"></div>
        </div>
        <div class="column" id="complete" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="col-header">Complete</div>
            <div class="task-list" id="complete-list"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
